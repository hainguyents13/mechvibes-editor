server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Hashed build assets never change, so browsers can keep them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: every other path serves index.html, which is never cached
  # so a new deploy is picked up on the next load.
  #
  # The CSP lets the page call only itself and the website API
  # (__WEBSITE_ORIGIN__ is filled in at image build time from
  # VITE_WEBSITE_URL), load pack icons and sign-in avatars, play and decode
  # audio from blob: URLs, and use Google Fonts. Inline styles are needed by
  # React style props and the waveform's injected stylesheet. Google Analytics
  # loads its tag from googletagmanager.com and sends hits to the Google hosts
  # listed in Google's CSP guide for GA4.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://downloads.mechvibes.com https://lh3.googleusercontent.com https://cdn.discordapp.com https://avatars.githubusercontent.com https://pbs.twimg.com https://*.google-analytics.com https://*.googletagmanager.com; media-src 'self' blob:; connect-src 'self' blob: __WEBSITE_ORIGIN__ https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri /index.html;
  }
}
